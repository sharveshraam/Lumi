[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lumi-assistant"
version = "1.0.0"
description = "LUMI - a local-first AI desktop assistant for Windows"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sharvesh Raam" }]
keywords = ["ai", "assistant", "local-first", "ollama", "desktop", "windows"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.11",
    "Topic :: Desktop Environment",
]

dependencies = [
    "PySide6>=6.6,<7",
    "httpx>=0.27",
    "jsonschema>=4.20",
    "python-dateutil>=2.8",
    "psutil>=5.9",
    "Pillow>=10.0",
]

[project.optional-dependencies]
desktop = ["pyautogui>=0.9.54 ; sys_platform == 'win32'", "pywinauto>=0.6.8 ; sys_platform == 'win32'"]
voice = ["faster-whisper>=1.0", "sounddevice>=0.4", "numpy>=1.24"]
dev = ["pytest>=8.0"]

[project.scripts]
lumi = "main:main"

[project.urls]
Homepage = "https://github.com/sharveshraam/Lumi"

[tool.setuptools]
packages = ["lumi", "lumi.ai", "lumi.automation", "lumi.automation.backends", "lumi.config", "lumi.memory", "lumi.notes", "lumi.reminders", "lumi.security", "lumi.tasks", "lumi.tools", "lumi.tools.builtin", "lumi.ui", "lumi.ui.pages", "lumi.ui.widgets", "lumi.utils", "lumi.voice", "lumi.integrations"]
py-modules = ["main"]

[tool.pytest.ini_options]
testpaths = ["lumi/tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
