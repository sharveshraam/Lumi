name: Android Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      build_release:
        description: 'Also build a signed release APK (requires signing secrets)'
        type: boolean
        default: false

permissions:
  contents: read
  checks: write

concurrency:
  group: android-build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  build:
    name: Test, lint and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out sources
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK packages
        run: |
          mkdir -p build-logs
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" 2>&1 | tail -n 5 | tee build-logs/00-sdk.log

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew :core:test :app:testDebugUnitTest --stacktrace 2>&1 | tee build-logs/10-unit-tests.log

      - name: Run Android lint
        run: ./gradlew :app:lintDebug --stacktrace 2>&1 | tee build-logs/20-lint.log

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee build-logs/30-assemble-debug.log

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: lumi-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lumi-reports
          path: |
            build-logs/
            app/build/reports/
            core/build/reports/
            app/build/test-results/
            core/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish failure diagnostics
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/ci-diagnostics.sh

  release:
    name: Signed release APK and GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.build_release)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Check out sources
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" 2>&1 | tail -n 5

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Prepare version and signing key
        id: prep
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "LUMI_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi
          echo "LUMI_VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          if [[ -n "$SIGNING_KEYSTORE_BASE64" ]]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lumi-release.jks"
            echo "LUMI_KEYSTORE_FILE=$RUNNER_TEMP/lumi-release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Signing secrets are not configured; skipping the signed release APK. See GITHUB_ACTIONS.md."
          fi

      - name: Build signed release APK
        if: steps.prep.outputs.signed == 'true'
        env:
          LUMI_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          LUMI_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          LUMI_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/lumi-${GITHUB_REF_NAME//\//-}-release.apk"

      - name: Build debug APK for the release
        run: |
          ./gradlew :app:assembleDebug --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/lumi-${GITHUB_REF_NAME//\//-}-debug.apk"

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/lumi-release.jks"

      - name: Upload release APKs
        uses: actions/upload-artifact@v7
        with:
          name: lumi-release-apks
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
